<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Sin `maximum-scale=1`: eso le PROHIBE al usuario agrandar con los dedos.
      Reportado en vivo (2026-08-19): "está todo miniaturizado" en el celular y
      no había forma de acercar. Bloquear el zoom no arregla un diseño chico,
      solo le saca al usuario la única salida que le quedaba -- y a quien no ve
      bien de cerca lo deja afuera directamente.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título y descripción -->
    <title>VentasPro - Sistema de Ventas con IA</title>
    <meta name="description" content="Sistema completo de ventas automatizadas con agentes de IA, gestión de conversaciones y análisis en tiempo real." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icono-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icono-192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VentasPro - Sistema de Ventas con IA" />
    <meta property="og:description" content="Sistema completo de ventas automatizadas con agentes de IA" />
    <meta property="og:image" content="https://ventasproia.com/opengraph.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VentasPro - Sistema de Ventas con IA" />
    <meta name="twitter:description" content="Sistema completo de ventas automatizadas con agentes de IA" />
    <meta name="twitter:image" content="https://ventasproia.com/opengraph.png" />
    
    <!-- Tema de color -->
    <meta name="theme-color" content="#4F46E5" />
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
