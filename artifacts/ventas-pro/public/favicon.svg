<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <rect width="180" height="180" rx="36" fill="url(#gradient)"/>
  
  <!-- Definición del gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Icono de chat con IA (burbujas de conversación) -->
  <g transform="translate(40, 45)">
    <!-- Burbuja principal -->
    <path d="M 10 20 Q 10 10, 20 10 L 70 10 Q 80 10, 80 20 L 80 50 Q 80 60, 70 60 L 30 60 L 15 75 L 15 60 Q 10 60, 10 50 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Burbuja secundaria (IA) -->
    <path d="M 30 70 Q 30 65, 35 65 L 75 65 Q 80 65, 80 70 L 80 85 Q 80 90, 75 90 L 50 90 L 40 100 L 40 90 Q 30 90, 30 85 Z" 
          fill="white" opacity="0.8"/>
    
    <!-- Puntos de "escribiendo..." en la burbuja principal -->
    <circle cx="35" cy="35" r="4" fill="#6366f1"/>
    <circle cx="50" cy="35" r="4" fill="#6366f1"/>
    <circle cx="65" cy="35" r="4" fill="#6366f1"/>
  </g>
</svg>
