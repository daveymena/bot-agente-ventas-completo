  </g>
  <text x="52" y="31" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.8" fill="#FFFFFF">Ventas<tspan fill="#9DB6D9">Pro</tspan></text>
