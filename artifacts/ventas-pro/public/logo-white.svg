<svg width="180" height="45" viewBox="0 0 180 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icono para fondos oscuros -->
  <defs>
    <linearGradient id="iconGradientWhite" x1="0" y1="0" x2="35" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo del icono -->
  <rect x="2" y="7" width="35" height="35" rx="10" fill="white" opacity="0.1"/>
  <rect x="0" y="5" width="35" height="35" rx="10" fill="white" opacity="0.15"/>
  
  <!-- Icono de mensaje/chat -->
  <path d="M 8 15 L 27 15 C 28.5 15 29 15.5 29 17 L 29 26 C 29 27.5 28.5 28 27 28 L 12 28 L 8 32 L 8 28 C 6.5 28 6 27.5 6 26 L 6 17 C 6 15.5 6.5 15 8 15 Z" 
        fill="white" opacity="0.95"/>
  
  <!-- Checkmark -->
  <path d="M 12 21 L 15 24 L 23 18" 
        stroke="url(#iconGradientWhite)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Texto en blanco -->
  <text x="45" y="30" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="-0.5"
        fill="white">
    Ventas<tspan fill="#a5b4fc">Pro</tspan>
  </text>
</svg>
