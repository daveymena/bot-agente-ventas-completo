<svg xmlns="http://www.w3.org/2000/svg" width="196" height="48" viewBox="0 0 196 48" role="img" aria-label="VentasPro">
  <title>VentasPro</title>
  <!--
  VentasPro: la V que sube en flecha (ventas que crecen) sobre el índigo→violeta
  del panel. Trazo grueso y redondeado para que aguante 16 px (la pestaña).
  Fuente única: scratch icon/apply.mjs genera favicon, marcas, logos y PNG.
-->
  
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,4) scale(0.078125)">
  <rect width="512" height="512" rx="118" fill="url(#g)"/>
  <rect width="512" height="512" rx="118" fill="url(#brillo)"/>
  <rect width="512" height="512" rx="118" fill="url(#sombra)"/>
  
  <path d="M136 172 L256 376 L390 130" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 130 H390 V208" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="52" y="31" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.8" fill="#FFFFFF">Ventas<tspan fill="#C7D2FE">Pro</tspan></text>
</svg>