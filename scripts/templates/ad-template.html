<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ad Template Híbrido</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #FFDF73;
      --gold-mid: #D4AF37;
      --gold-dark: #996515;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1080px;
      /* El fondo por defecto, pero JS lo sobreescribirá con la IA */
      background: #111;
      background-size: cover;
      font-family: 'Montserrat', sans-serif;
      color: white;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Oscurecemos arriba (para el título) y abajo (para beneficios), dejando el centro transparente para ver a la persona */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 35%, rgba(0,0,0,0.95) 70%);
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .header {
      padding: 50px 60px 20px;
      text-align: left;
    }

    .pre-title {
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: -10px;
      text-shadow: 0px 4px 15px rgba(0,0,0,0.8);
    }

    .main-title {
      font-size: 130px;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(to bottom, #FFF2A8 0%, #D4AF37 40%, #996515 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.9));
      margin-left: -5px;
    }

    .post-title {
      font-family: 'Great Vibes', cursive;
      font-size: 85px;
      color: white;
      margin-top: -30px;
      text-align: center;
      width: 100%;
      text-shadow: 0px 5px 20px rgba(212,175,55,0.8);
    }

    .badge-level {
      display: inline-block;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent);
      border-top: 2px solid var(--gold-mid);
      border-bottom: 2px solid var(--gold-mid);
      padding: 10px 40px;
      font-size: 30px;
      font-weight: 800;
      color: var(--gold-light);
      margin: 10px auto;
      align-self: center;
      text-transform: uppercase;
      box-shadow: 0px 0px 30px rgba(212,175,55,0.3);
    }
    
    .subtitle {
      font-size: 26px;
      text-align: center;
      font-weight: 400;
      margin-top: 15px;
      padding: 0 50px;
      text-shadow: 0px 2px 5px rgba(0,0,0,1);
    }
    
    .subtitle span {
      color: var(--gold-mid);
      font-weight: 800;
      font-style: italic;
    }

    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      padding: 40px 60px;
      margin-top: 10px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 15px;
      border: 1px solid rgba(212,175,55,0.4);
      backdrop-filter: blur(8px);
    }

    .icon-box {
      width: 60px;
      height: 60px;
      border: 2px solid var(--gold-mid);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(212,175,55,0.4), 0 0 20px rgba(212,175,55,0.5);
      flex-shrink: 0;
      background: rgba(0,0,0,0.7);
    }

    .icon-box svg {
      width: 35px;
      height: 35px;
      fill: var(--gold-light);
    }

    .feature-text h3 {
      color: var(--gold-light);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .feature-text p {
      font-size: 18px;
      color: #eee;
      line-height: 1.2;
    }

    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 180px;
      background: linear-gradient(to top, rgba(0,0,0,1) 40%, rgba(0,0,0,0.8) 70%, transparent);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 30px;
      z-index: 5;
    }

    .megapack-banner {
      background: linear-gradient(90deg, #996515, #D4AF37, #FFF2A8, #D4AF37, #996515);
      padding: 15px;
      text-align: center;
      color: black;
      font-weight: 900;
      font-size: 55px;
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: skewY(-2deg);
      box-shadow: 0px -10px 40px rgba(212,175,55,0.6);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- La imagen de fondo la cargaremos en el body dinámicamente -->
  <div class="overlay"></div>
  
  <div class="content-wrapper">
    <div class="header" id="header-container">
      <div class="pre-title">CURSO DE</div>
      <div class="main-title" id="title">PRODUCTO</div>
      <div class="post-title">COMPLETO</div>
    </div>

    <div style="display:flex; flex-direction:column; width:100%; align-items:center;">
      <div class="badge-level">DE CERO A AVANZADO</div>
      <div class="subtitle">APRENDE A DOMINAR ESTA HABILIDAD <span>DESDE CASA</span> Y <span>A TU PROPIO RITMO</span></div>
    </div>

    <div class="features-grid" id="features">
      <!-- Se inyectará con JS -->
    </div>
  </div>

  <div class="footer">
    <div class="megapack-banner" id="price">MEGAPACK $20.000 COP</div>
  </div>

  <script>
    const data = window.__INJECTED_DATA__ || {
      title: "MARKETING DIGITAL",
      price: "MEGAPACK $20.000 COP",
      bgUrl: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?q=80&w=1080&auto=format&fit=crop",
      features: [
        "No necesitas experiencia previa",
        "Lecciones organizadas paso a paso",
        "Acceso ilimitado de por vida",
        "Soporte y material de apoyo"
      ]
    };

    // Aplicar la imagen generada por IA como fondo
    if (data.bgUrl) {
      document.body.style.background = \`url('\${data.bgUrl}') no-repeat center center\`;
      document.body.style.backgroundSize = 'cover';
    }

    const titleEl = document.getElementById('title');
    titleEl.textContent = data.title;
    if (data.title.length > 20) {
      titleEl.style.fontSize = '80px';
    } else if (data.title.length > 15) {
      titleEl.style.fontSize = '100px';
    }

    document.getElementById('price').textContent = data.price;

    const icons = [
      '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>',
      '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>',
      '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v-2h2V7c0-1.1.9-2 2-2h2c1.1 0 2 .9 2 2v3h2v2h-2v2h2v2h-2v-2h-2v-2z"/>',
      '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>'
    ];

    const featuresContainer = document.getElementById('features');
    const fList = data.features.slice(0, 4);
    
    while(fList.length < 4) {
      const defaultFeats = ["Acceso de por vida", "Actualizaciones gratis", "Soporte premium", "Certificado digital"];
      fList.push(defaultFeats[fList.length]);
    }

    fList.forEach((feat, index) => {
      const svgIcon = icons[index % icons.length];
      const titleText = index === 0 ? "DESDE CERO" : index === 1 ? "PASO A PASO" : index === 2 ? "A TU RITMO" : "PROFESIONAL";
      
      const html = `
        <div class="feature-item">
          <div class="icon-box">
            <svg viewBox="0 0 24 24">${svgIcon}</svg>
          </div>
          <div class="feature-text">
            <h3>${titleText}</h3>
            <p>${feat}</p>
          </div>
        </div>
      `;
      featuresContainer.innerHTML += html;
    });
  </script>
</body>
</html>
