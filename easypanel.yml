version: "1.0"

services:
  api-server:
    name: "Sofía API Server"
    description: "WhatsApp AI Sales Bot Backend"

    build:
      dockerfile: ./Dockerfile
      context: .

    ports:
      - "3002:3002"

    environment:
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      APP_URL: ${APP_URL}
      LOG_LEVEL: info
      USE_SQLITE: "true"
      SQLITE_PATH: "./data/tecnovariedades.db"

      # ========== AI FALLBACK ==========
      AI_FALLBACK_ENABLED: "${AI_FALLBACK_ENABLED:-true}"
      AI_FALLBACK_ORDER: "${AI_FALLBACK_ORDER:-opencode,groq,github,g4f}"
      # Autoevaluación curada: solo aplica una mejora gestionada, validada y reversible.
      AUTOREFLEXION_ENABLED: "${AUTOREFLEXION_ENABLED:-true}"
      OPENCODE_API_URL: "${OPENCODE_API_URL:-https://api.freemodel.dev/v1}"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY}"
      OPENCODE_MODEL: "${OPENCODE_MODEL:-deepseek-v4-flash-free}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.1-8b-instant}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-qwen/qwen-2.5-7b-instruct:free}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY}"
      CEREBRAS_MODEL: "${CEREBRAS_MODEL:-llama-3.1-8b-instruct}"
      OLLAMA_LOCAL_URL: "${OLLAMA_LOCAL_URL}"
      OLLAMA_LOCAL_MODEL: "${OLLAMA_LOCAL_MODEL:-hermes3:8b}"
      OLLAMA_CLOUD_API_KEY: "${OLLAMA_CLOUD_API_KEY}"
      OLLAMA_CLOUD_MODEL: "${OLLAMA_CLOUD_MODEL:-gpt-oss:20b}"
      ATLAS_DIRECTO: "${ATLAS_DIRECTO:-false}"
      ATLAS_DIRECTO_URL: "${ATLAS_DIRECTO_URL}"
      ATLAS_DIRECTO_MODELO: "${ATLAS_DIRECTO_MODELO}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_MODEL: "${GITHUB_MODEL:-gpt-4o-mini}"
      GITHUB_MODEL_CLAUDE: "${GITHUB_MODEL_CLAUDE:-claude-sonnet-4-20250514}"
      G4F_ENABLED: "${G4F_ENABLED:-true}"
      G4F_PROVIDER: "${G4F_PROVIDER:-auto}"
      G4F_MODEL: "${G4F_MODEL:-gpt-4-turbo}"
      G4F_TIMEOUT: "${G4F_TIMEOUT:-30}"

      # ========== PAGOS ==========
      TRANSFER_NUMBER: "${TRANSFER_NUMBER}"
      TRANSFER_NAME: "${TRANSFER_NAME}"
      MERCADO_PAGO_PUBLIC_KEY: "${MERCADO_PAGO_PUBLIC_KEY}"
      MERCADO_PAGO_ACCESS_TOKEN: "${MERCADO_PAGO_ACCESS_TOKEN}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET}"
      PAYPAL_MODE: "${PAYPAL_MODE:-live}"
      PAYPAL_EXCHANGE_RATE: "${PAYPAL_EXCHANGE_RATE:-3100}"
      EXCHANGE_RATE: "${EXCHANGE_RATE:-3100}"

      # ========== NOTIFICACIONES ==========
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      EMAIL_FROM: "${EMAIL_FROM}"
      EMAIL_TO: "${EMAIL_TO}"

      # ========== FACEBOOK ==========
      FB_APP_ID: "${FB_APP_ID}"
      FB_APP_SECRET: "${FB_APP_SECRET}"
      FB_PAGE_ID: "${FB_PAGE_ID}"
      FB_ACCESS_TOKEN: "${FB_ACCESS_TOKEN}"
      FB_MESSENGER_PAGE_TOKEN: "${FB_MESSENGER_PAGE_TOKEN}"
      FB_AD_ACCOUNT_ID: "${FB_AD_ACCOUNT_ID}"
      FB_PIXEL_ID: "${FB_PIXEL_ID}"
      FB_CATALOG_ID: "${FB_CATALOG_ID}"
      FB_WEBHOOK_VERIFY_TOKEN: "${FB_WEBHOOK_VERIFY_TOKEN:-salesbot_verify_2024}"
      FB_MESSENGER_VERIFY_TOKEN: "${FB_MESSENGER_VERIFY_TOKEN:-salesbot_messenger_2024}"

      # ========== ADMIN ==========
      ADMIN_PHONE: "${ADMIN_PHONE}"

    healthCheck:
      path: /api/health
      interval: 30s
      timeout: 10s
      retries: 3
      startPeriod: 5s

    resources:
      limits:
        cpus: "2"
        memory: "2G"
      requests:
        cpus: "0.5"
        memory: "512M"

    restart:
      policy: always
      maxRetries: 5

    volumes:
      - ./data:/app/data

  postgres:
    name: "PostgreSQL Database"
    image: "postgres:16-alpine"
    environment:
      POSTGRES_DB: tecnovariedades-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  opencode-proxy:
    name: "OpenCode AI Proxy"
    description: "Proxy local para OpenCode AI (persistente vía opencode serve)"

    build:
      dockerfile: ./artifacts/opencode-proxy/Dockerfile
      context: .

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      LOG_LEVEL: INFO
      DEFAULT_MODEL: deepseek-v4-flash-free
      MAX_TIMEOUT: 180
      OPENCODE_ZEN_BASE_URL: https://opencode.ai/zen/v1

    healthCheck:
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
      startPeriod: 30s

    resources:
      limits:
        cpus: "1"
        memory: "1G"
      requests:
        cpus: "0.25"
        memory: "256M"

    restart:
      policy: always
      maxRetries: 5

    volumes:
      - opencode_data:/app/data
      - opencode_logs:/app/logs

  ollama:
    name: "Ollama AI Engine"
    image: "ollama/ollama:latest"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  ollama_data:
  opencode_data:
  opencode_logs:

deployment:
  preDeployment: []
  postDeployment:
    - "echo 'Deployment completed successfully'"
  migrations: []

monitoring:
  metrics:
    - cpu
    - memory
    - disk
    - network

  logs:
    - /app/logs
    - stdout
    - stderr

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 7
  targets:
    - postgres_data
    - ./data
